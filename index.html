<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="app"  id="app">
        <section class="sidebar">
            <div class="sidebar__icon" id="hide"></div>
            <div class="sidebar__icon"></div>
        </section>
        <section class="novbar">
            <div class="novbar__controls">
                <div>Сортировка</div>
                <input class="novbar__controls_input" type="text" placeholder="Поиск заметок" >
            </div>
            <div class="navbar__scroll">
                <div class="navbar__month" id="navbar">

                    <!--
                    <div class="navbar__month_title">
                        Июнь 2018
                    </div>
                    <div class="navbar__month-note">
                        <div class="navbar__month-note-date">
                            <div class="navbar__month-note-num">18</div>
                            <div class="navbar__month-note-day">Monday</div>
                        </div>
                        <div class="navbar__month_note-description">
                            <div><b>Планирование бюджета</b></div>
                            <div>Я сеговдня вкусно поел...
                        </div>

                        </div>
                    </div>
                -->

                </div>
            </div>
        </section>

        <section class="editor">
             <div class="editor__tools">
                <button data-tiptap-button="bold">Bold</button>
                <button data-tiptap-button="italic">Italic</button>
                <button data-tiptap-button="strike">Strike</button>
                <button data-tiptap-button="code">Code</button>
                <button data-tiptap-button="h1">H1</button>
                <button data-tiptap-button="h2">H2</button>
                <button data-tiptap-button="bulletList">Bullet List</button>
                <button data-tiptap-button="orderedList">Ordered List</button>
                <button data-tiptap-button="blockquote">Blockquote</button>
                <button data-tiptap-button="codeBlock">Code Block</button>
            </div>
            <div class="editor__content" id="editor-content"></div>
        </section>
    </div>
    <div class="shadow" id="shadow">
        <div class="modal">
            <h2 class="modal__title">Новая заметка</h2>
            <input class="modal__input" id="note-title" type="text" placeholder="Заголовок">
            <textarea class="modal__input modal__textarea" id="note-description" placeholder="Текст заметки"></textarea>
            <div class="modal__buttons">
                <button id="btn-save">Сохранить</button>
                <button id="btn-close">Закрыть</button>
            </div>
        </div>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
